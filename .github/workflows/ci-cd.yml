name: Build & Deploy Catenicus to NAS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ── Job 1: Typecheck & build monorepo on GitHub's servers ─────────────────
  build-and-typecheck:
    name: Typecheck & Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared, client, and server
        run: npm run build

  # ── Job 2: Build & push Docker image to GHCR (~45s on native amd64) ───────
  publish-docker:
    name: Build & Push Docker Image to GHCR
    needs: build-and-typecheck
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Catenicus image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.IMAGE_NAME }}:latest

  # ── Job 3: Instant deploy on NAS via self-hosted runner (like aqm & ad_tds)
  deploy:
    name: Instant Deploy on NAS
    needs: publish-docker
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, nas]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull new image on NAS
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Restart Catenicus container
        run: |
          STACK_DIR="/volume2/docker/catenicus_film-photog_assistant"
          if [ -d "$STACK_DIR" ]; then
            docker compose -f "$STACK_DIR/docker-compose.yml" up -d --no-deps catenicus
          else
            docker compose -f docker-compose.yml up -d --no-deps catenicus
          fi

